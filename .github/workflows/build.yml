name: Build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  core-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.6' }
      - run: swift test --parallel
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.6' }
      - run: brew install xcodegen && xcodegen --version
      - name: Generate project
        working-directory: App
        run: xcodegen generate
      - name: Archive (unsigned)
        working-directory: App
        run: |
          xcodebuild clean archive \
            -project MioTube.xcodeproj -scheme MioTube -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MioTube.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/MioTube.xcarchive/Products/Applications/MioTube.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry "MioTube-${GITHUB_SHA::7}-unsigned.ipa" Payload
          ditto -c -k --keepParent "$RUNNER_TEMP/MioTube.xcarchive/dSYMs" "$RUNNER_TEMP/MioTube-${GITHUB_SHA::7}-dSYMs.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: MioTube-ipa
          path: |
            ${{ runner.temp }}/MioTube-*-unsigned.ipa
            ${{ runner.temp }}/MioTube-*-dSYMs.zip
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ runner.temp }}/MioTube-*-unsigned.ipa
            ${{ runner.temp }}/MioTube-*-dSYMs.zip
          generate_release_notes: true
          # Tags with a suffix (v1.1.0-pre.3) are test builds: published as pre-releases so
          # they never show up as the "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
